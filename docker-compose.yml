# docker-compose.yml
version: '3.8'

services:
  # 1. DATABASE - PostgreSQL with real-time triggers
  postgres:
    image: postgres:16
    container_name: agent_postgres
    environment:
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: agent_tracking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - agent_network
    restart: unless-stopped

  # 2. BACKEND - Node.js Express + tRPC
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: agent_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://agent_user:secure_password@postgres:5432/agent_tracking
      JWT_SECRET: ${JWT_SECRET:-replace-me-with-a-long-random-secret}
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - agent_network
    restart: unless-stopped
    command: pnpm dev:server

  # 3. FRONTEND - React Dashboard (Vite)
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: agent_frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:5173"
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - agent_network
    restart: unless-stopped

  # 4. REDIS - For real-time pub/sub and caching
  redis:
    image: redis:7-alpine
    container_name: agent_redis
    ports:
      - "6379:6379"
    networks:
      - agent_network
    restart: unless-stopped

  # 4. PGADMIN - Database management GUI
  pgadmin:
    image: dpage/pgadmin4
    container_name: agent_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agent.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - agent_network
    restart: unless-stopped

networks:
  agent_network:
    driver: bridge

volumes:
  postgres_data:
